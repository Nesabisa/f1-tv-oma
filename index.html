<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DC0000">
  <title>F1 im TV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fr: #DC0000;
      --fd: #8B0000;
      --fb: #0a0a0a;
      --fc: #1C1C1C;
      --fg: #C9A227;
      --fw: #ffffff;
      --fgray: #aaa;
    }

    html, body {
      background: var(--fb);
      color: var(--fw);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .hdr {
      background: var(--fr);
      padding: 20px 20px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hdr::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.06) 40px, rgba(0,0,0,0.06) 41px);
    }
    .hdr-inner { position: relative; z-index: 1; }
    .hdr-horse { margin-bottom: 6px; }
    .hdr-title {
      font-family: 'Oswald', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .hdr-sub {
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.8;
      margin-top: 3px;
    }

    .stripe {
      height: 5px;
      background: linear-gradient(90deg, var(--fg) 0%, var(--fg) 33%, #fff 33%, #fff 66%, var(--fg) 66%);
    }

    .sec { padding: 20px 16px 6px; }
    .sec-label {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--fg);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-card {
      background: var(--fr);
      border-radius: 16px;
      padding: 22px 20px;
      position: relative;
      overflow: hidden;
    }
    .live-card::after {
      content: '';
      position: absolute;
      right: -14px; top: -14px;
      width: 110px; height: 110px;
      background: rgba(0,0,0,0.12);
      border-radius: 50%;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .live-dot {
      width: 11px; height: 11px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .live-badge-txt {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      letter-spacing: 3px;
      opacity: 0.9;
    }
    .live-session {
      font-family: 'Oswald', sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }
    .live-race {
      font-size: 18px;
      opacity: 0.95;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .live-flag {
      font-size: 34px;
      position: absolute;
      right: 20px; top: 20px;
      opacity: 0.45;
      z-index: 0;
    }
    .live-chan {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.28);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
    .live-chan-dot {
      width: 11px; height: 11px;
      background: #4ADE80;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .nothing {
      background: var(--fc);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
    }
    .nothing-ico { font-size: 52px; margin-bottom: 14px; }
    .nothing-txt {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      color: var(--fgray);
    }

    .next-card {
      background: var(--fc);
      border-radius: 16px;
      padding: 22px 22px;
      border-left: 4px solid var(--fg);
    }
    .next-session {
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .next-race {
      font-size: 16px;
      color: #bbb;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .next-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .next-ico { font-size: 18px; color: var(--fg); }
    .next-val {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      color: var(--fg);
    }
    .next-chan { font-size: 17px; color: #ddd; margin-top: 4px; }
    .countdown {
      font-size: 15px;
      color: var(--fgray);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .countdown span { color: #fff; font-weight: 600; }

    .sched-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px solid #222;
    }
    .sched-item:last-child { border-bottom: none; }
    .sched-flag { font-size: 28px; flex-shrink: 0; width: 36px; text-align: center; }
    .sched-info { flex: 1; min-width: 0; }
    .sched-session {
      font-family: 'Oswald', sans-serif;
      font-size: 19px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sched-race {
      font-size: 13px;
      color: var(--fgray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .sched-right { text-align: right; flex-shrink: 0; }
    .sched-date {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: var(--fg);
    }
    .sched-time { font-size: 14px; color: var(--fgray); margin-top: 1px; }
    .sched-chan { font-size: 12px; color: #888; margin-top: 2px; }

    .season-item {
      border-bottom: 1px solid #1e1e1e;
    }
    .season-item:last-child { border-bottom: none; }
    .season-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      cursor: pointer;
      user-select: none;
    }
    .season-item.past .season-row { opacity: 0.4; }
    .season-item.current .season-row { opacity: 1; }
    .season-item.current { border-left: 3px solid var(--fr); padding-left: 12px; }
    .season-flag { font-size: 28px; flex-shrink: 0; width: 36px; text-align: center; }
    .season-info { flex: 1; min-width: 0; }
    .season-name {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .season-loc { font-size: 12px; color: var(--fgray); margin-top: 2px; }
    .season-right { text-align: right; flex-shrink: 0; }
    .season-date {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      color: var(--fg);
    }
    .season-rnd { font-size: 11px; color: #666; margin-top: 2px; }
    .season-chevron {
      font-size: 14px;
      color: #555;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .season-item.open .season-chevron { transform: rotate(90deg); color: var(--fg); }

    .season-sessions {
      display: none;
      background: #111;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .season-item.open .season-sessions { display: block; }
    .sess-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid #1a1a1a;
    }
    .sess-row:last-child { border-bottom: none; }
    .sess-row.past-sess { opacity: 0.4; }
    .sess-row.live-sess { background: rgba(220,0,0,0.15); }
    .sess-type {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 500;
      width: 120px;
      flex-shrink: 0;
    }
    .sess-date { font-size: 13px; color: var(--fgray); flex: 1; }
    .sess-time {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: var(--fg);
      flex-shrink: 0;
    }
    .sess-live-dot {
      width: 8px; height: 8px;
      background: var(--fr);
      border-radius: 50%;
      flex-shrink: 0;
      animation: blink 1.4s infinite;
    }

    .stand-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .stand-item:last-child { border-bottom: none; }
    .stand-pos {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--fgray);
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .stand-pos.p1 { color: #FFD700; }
    .stand-pos.p2 { color: #C0C0C0; }
    .stand-pos.p3 { color: #CD7F32; }
    .stand-info { flex: 1; min-width: 0; }
    .stand-name {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stand-team {
      font-size: 13px;
      color: var(--fgray);
      margin-top: 2px;
    }
    .stand-right { text-align: right; flex-shrink: 0; }
    .stand-pts {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      color: var(--fg);
    }
    .stand-pts-label { font-size: 11px; color: #666; }
    .stand-gap {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: #bbb;
    }
    .stand-loading {
      text-align: center;
      padding: 20px;
      color: var(--fgray);
      font-size: 15px;
    }

    .update-time {
      text-align: center;
      font-size: 12px;
      color: #666;
      padding: 16px 0 0;
      letter-spacing: 1px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      padding: 8px 0 0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="hdr-inner">
      <div class="hdr-horse">
        <svg width="50" height="50" viewBox="0 0 100 100" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M62 8 C62 8 70 6 74 12 C78 18 72 24 68 26 C72 26 78 24 80 20 C82 16 80 10 76 8 C82 6 88 10 88 16 C88 24 80 30 72 30 L70 34 C74 36 78 42 76 50 C74 58 66 62 60 60 L58 72 C58 80 54 88 48 90 L44 90 C44 90 48 82 48 74 L46 74 C46 74 42 82 36 84 L32 84 C32 84 38 74 38 66 L36 68 C36 68 28 74 20 72 C12 70 8 62 10 54 C12 48 18 44 24 44 C20 42 14 38 12 32 C10 26 14 20 20 18 C26 16 34 20 36 26 C38 22 44 16 50 14 C54 12 58 10 62 8Z"/>
        </svg>
      </div>
      <div class="hdr-title">F1 im TV</div>
      <div class="hdr-sub">Formel 1 Programm</div>
    </div>
  </div>
  <div class="stripe"></div>

  <div class="sec">
    <div class="sec-label">&#9679; Jetzt im Fernsehen</div>
    <div id="live-content"></div>
  </div>

  <div class="sec">
    <div class="sec-label">&#8594; Als nächstes</div>
    <div id="next-content"></div>
  </div>

  <div class="sec" style="padding-bottom: 16px;">
    <div class="sec-label">&#128197; Rennen <span class="season-year">2026</span></div>
    <div id="season-content"></div>
  </div>

  <div class="sec" style="padding-bottom: 16px;">
    <div class="sec-label" id="stand-label">&#127942; Fahrerwertung</div>
    <div id="stand-content"><div class="stand-loading">Wird geladen…</div></div>
  </div>

  <div class="update-time" id="update-time"></div>
  <div class="footer">Scuderia Ferrari &middot; Formel 1 <span class="season-year">2026</span></div>

</div>

<script>
  const DAYS_DE   = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const openRaces = new Set(); // welche Rennen im Kalender aufgeklappt sind
  let autoOpened = false;
  // Freitags-Sessions, die Oma nicht braucht (weder im Kalender noch bei Jetzt/Als Nächstes)
  const HIDDEN_SESSIONS = ['FP1','FP2','Sprintqualifying'];

  // ── Hilfsfunktionen ───────────────────────────────────────────────────
  function fmtDate(d){
    return DAYS_DE[d.getDay()]+', '+d.getDate()+'. '+MONTHS_DE[d.getMonth()];
  }
  function fmtTime(d){
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+' Uhr';
  }
  function fmtCountdown(ms){
    if(ms < 0) return '';
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    if(h >= 48){ return 'in '+Math.floor(h/24)+' Tagen'; }
    if(h >= 24){ const d=Math.floor(h/24); return 'in '+d+' Tag'+(d===1?'':'en'); }
    if(h > 0)  { return 'in '+h+' Std. '+m+' Min.'; }
    return 'in '+m+' Minute'+(m===1?'':'n');
  }

  // ── Länder (englisch, wie die API sie liefert) → Ländercode für Flagge & deutschen Namen ─
  const COUNTRY_ISO = {
    'Australia':'AU', 'China':'CN', 'Japan':'JP', 'Bahrain':'BH', 'Saudi Arabia':'SA',
    'USA':'US', 'United States':'US', 'Canada':'CA', 'Monaco':'MC', 'Spain':'ES',
    'Austria':'AT', 'UK':'GB', 'United Kingdom':'GB', 'Great Britain':'GB', 'Belgium':'BE',
    'Hungary':'HU', 'Netherlands':'NL', 'Italy':'IT', 'Azerbaijan':'AZ', 'Malaysia':'MY',
    'Singapore':'SG', 'Mexico':'MX', 'Brazil':'BR', 'Qatar':'QA', 'UAE':'AE',
    'United Arab Emirates':'AE', 'France':'FR', 'Germany':'DE', 'Portugal':'PT',
    'Turkey':'TR', 'Russia':'RU', 'Vietnam':'VN', 'South Africa':'ZA', 'Argentina':'AR',
    'Korea':'KR', 'South Korea':'KR', 'India':'IN', 'Thailand':'TH', 'Rwanda':'RW',
    'Morocco':'MA', 'Switzerland':'CH', 'Sweden':'SE', 'Indonesia':'ID',
  };
  const REGION_DE = (() => { try { return new Intl.DisplayNames(['de'], {type:'region'}); } catch(_){ return null; } })();

  function flagOf(iso){
    return iso ? String.fromCodePoint(...[...iso].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '🏁';
  }
  function countryDE(country){
    const iso = COUNTRY_ISO[country];
    const SHORT = {US:'USA', GB:'Großbritannien', AE:'Abu Dhabi'};
    if(SHORT[iso]) return SHORT[iso];
    try { return (iso && REGION_DE && REGION_DE.of(iso)) || country; } catch(_){ return country; }
  }

  // ── Free-TV zusätzlich zu Sky (pro Strecke = circuitId der API) ───────
  // Quellen (Stand Sept. 2026): RTL-Fahrplan laut motorsport-total.com,
  // ORF-Fahrplan laut der.orf.at. Unbekannte Strecken → nur "Sky Sport F1".
  const R = {rtl:true}, O = {orf:true}, RO = {rtl:true, orf:true};
  const FREE_TV = {
    // RTL: 5 komplette Wochenenden (Quali + Rennen) + 5 einzelne Samstage
    'monaco':      {Qualifying:RO, Rennen:RO},
    'spa':         {Qualifying:R,  Rennen:R},
    'zandvoort':   {Qualifying:R,  Rennen:R},
    'madring':     {Qualifying:RO, Rennen:RO},
    'vegas':       {Qualifying:RO, Rennen:RO},
    'silverstone': {Sprint:RO, Qualifying:O, Rennen:O},
    'hungaroring': {Qualifying:RO, Rennen:O},
    'monza':       {Qualifying:R},
    'marina_bay':  {Sprint:RO, Qualifying:O, Rennen:O},
    'americas':    {Qualifying:R},
    // ORF 1: 12 Rennen live
    'shanghai':    {Sprint:O, Qualifying:O, Rennen:O},
    'bahrain':     {Qualifying:O, Rennen:O},
    'miami':       {Sprint:O, Qualifying:O, Rennen:O},
    'catalunya':   {Qualifying:O, Rennen:O},
    'rodriguez':   {Qualifying:O, Rennen:O},
    'yas_marina':  {Qualifying:O, Rennen:O},
  };

  function buildChan(rtl, orf){
    const parts = ['Sky Sport F1'];
    if(rtl) parts.push('RTL');
    if(orf) parts.push('ORF 1');
    return parts.join(' · ');
  }

  // ── API-Session → Deutsch + ungefähre Dauer in Minuten ────────────────
  const SESSIONS = [
    ['FirstPractice',    'FP1',              60],
    ['SecondPractice',   'FP2',              60],
    ['ThirdPractice',    'FP3',              60],
    ['SprintQualifying', 'Sprintqualifying', 45],
    ['Sprint',           'Sprint',           60],
    ['Qualifying',       'Qualifying',       60],
  ];

  // ── Rennkalender der API → internes Format (alles automatisch) ────────
  function apiToCalendar(races){
    // Gibt es mehrere Rennen im selben Land (z. B. USA, Spanien), nimm den Ort als Namen
    const perCountry = {};
    for(const r of races){ const c = r.Circuit.Location.country; perCountry[c] = (perCountry[c]||0) + 1; }

    return races.map(r => {
      const L  = r.Circuit.Location;
      const id = r.Circuit.circuitId;
      const tv = FREE_TV[id] || {};
      const mk = (type, date, time, dur) => {
        const t = tv[type] || {};
        return {type, start: new Date(date+'T'+(time||'12:00:00Z')), dur, rtl: !!t.rtl, orf: !!t.orf};
      };
      const sessions = SESSIONS.filter(([k]) => r[k]).map(([k, type, dur]) => mk(type, r[k].date, r[k].time, dur));
      sessions.push(mk('Rennen', r.date, r.time, 120));
      sessions.sort((a,b) => a.start - b.start);
      return {
        rnd:  +r.round,
        race: perCountry[L.country] > 1 ? L.locality : countryDE(L.country),
        loc:  r.Circuit.circuitName + (r.Circuit.circuitName.includes(L.locality) ? '' : ', ' + L.locality),
        flag: flagOf(COUNTRY_ISO[L.country]),
        sessions,
      };
    });
  }

  // ── Fallback-Kalender, falls kein Internet (Stand 27.09.2026) ─────────
  const FALLBACK_RAW = [
    {"round":"1","date":"2026-03-08","time":"04:00:00Z","Circuit":{"circuitId":"albert_park","circuitName":"Albert Park Grand Prix Circuit","Location":{"locality":"Melbourne","country":"Australia"}},"FirstPractice":{"date":"2026-03-06","time":"01:30:00Z"},"SecondPractice":{"date":"2026-03-06","time":"05:00:00Z"},"ThirdPractice":{"date":"2026-03-07","time":"01:30:00Z"},"Qualifying":{"date":"2026-03-07","time":"05:00:00Z"}},
    {"round":"2","date":"2026-03-15","time":"07:00:00Z","Circuit":{"circuitId":"shanghai","circuitName":"Shanghai International Circuit","Location":{"locality":"Shanghai","country":"China"}},"FirstPractice":{"date":"2026-03-13","time":"03:30:00Z"},"SprintQualifying":{"date":"2026-03-13","time":"07:30:00Z"},"Sprint":{"date":"2026-03-14","time":"03:00:00Z"},"Qualifying":{"date":"2026-03-14","time":"07:00:00Z"}},
    {"round":"3","date":"2026-03-29","time":"05:00:00Z","Circuit":{"circuitId":"suzuka","circuitName":"Suzuka Circuit","Location":{"locality":"Suzuka","country":"Japan"}},"FirstPractice":{"date":"2026-03-27","time":"02:30:00Z"},"SecondPractice":{"date":"2026-03-27","time":"06:00:00Z"},"ThirdPractice":{"date":"2026-03-28","time":"02:30:00Z"},"Qualifying":{"date":"2026-03-28","time":"06:00:00Z"}},
    {"round":"4","date":"2026-05-03","time":"20:00:00Z","Circuit":{"circuitId":"miami","circuitName":"Miami International Autodrome","Location":{"locality":"Miami","country":"USA"}},"FirstPractice":{"date":"2026-05-01","time":"16:00:00Z"},"SprintQualifying":{"date":"2026-05-01","time":"20:30:00Z"},"Sprint":{"date":"2026-05-02","time":"16:00:00Z"},"Qualifying":{"date":"2026-05-02","time":"20:00:00Z"}},
    {"round":"5","date":"2026-05-24","time":"20:00:00Z","Circuit":{"circuitId":"villeneuve","circuitName":"Circuit Gilles Villeneuve","Location":{"locality":"Montreal","country":"Canada"}},"FirstPractice":{"date":"2026-05-22","time":"16:30:00Z"},"SprintQualifying":{"date":"2026-05-22","time":"20:30:00Z"},"Sprint":{"date":"2026-05-23","time":"16:00:00Z"},"Qualifying":{"date":"2026-05-23","time":"20:00:00Z"}},
    {"round":"6","date":"2026-06-07","time":"13:00:00Z","Circuit":{"circuitId":"monaco","circuitName":"Circuit de Monaco","Location":{"locality":"Monte Carlo","country":"Monaco"}},"FirstPractice":{"date":"2026-06-05","time":"11:30:00Z"},"SecondPractice":{"date":"2026-06-05","time":"15:00:00Z"},"ThirdPractice":{"date":"2026-06-06","time":"10:30:00Z"},"Qualifying":{"date":"2026-06-06","time":"14:00:00Z"}},
    {"round":"7","date":"2026-06-14","time":"13:00:00Z","Circuit":{"circuitId":"catalunya","circuitName":"Circuit de Barcelona-Catalunya","Location":{"locality":"Barcelona","country":"Spain"}},"FirstPractice":{"date":"2026-06-12","time":"11:30:00Z"},"SecondPractice":{"date":"2026-06-12","time":"15:00:00Z"},"ThirdPractice":{"date":"2026-06-13","time":"10:30:00Z"},"Qualifying":{"date":"2026-06-13","time":"14:00:00Z"}},

    {"round":"20","date":"2026-11-08","time":"17:00:00Z","Circuit":{"circuitId":"interlagos","circuitName":"Autódromo José Carlos Pace","Location":{"locality":"São Paulo","country":"Brazil"}},"FirstPractice":{"date":"2026-11-06","time":"15:30:00Z"},"SecondPractice":{"date":"2026-11-06","time":"19:00:00Z"},"ThirdPractice":{"date":"2026-11-07","time":"14:30:00Z"},"Qualifying":{"date":"2026-11-07","time":"18:00:00Z"}},
    {"round":"21","date":"2026-11-22","time":"04:00:00Z","Circuit":{"circuitId":"vegas","circuitName":"Las Vegas Strip Street Circuit","Location":{"locality":"Las Vegas","country":"USA"}},"FirstPractice":{"date":"2026-11-20","time":"00:30:00Z"},"SecondPractice":{"date":"2026-11-20","time":"04:00:00Z"},"ThirdPractice":{"date":"2026-11-21","time":"00:30:00Z"},"Qualifying":{"date":"2026-11-21","time":"04:00:00Z"}},
    {"round":"22","date":"2026-11-29","time":"16:00:00Z","Circuit":{"circuitId":"losail","circuitName":"Lusail International Circuit","Location":{"locality":"Lusail","country":"Qatar"}},"FirstPractice":{"date":"2026-11-27","time":"13:30:00Z"},"SecondPractice":{"date":"2026-11-27","time":"17:00:00Z"},"ThirdPractice":{"date":"2026-11-28","time":"14:30:00Z"},"Qualifying":{"date":"2026-11-28","time":"18:00:00Z"}},
    {"round":"23","date":"2026-12-06","time":"13:00:00Z","Circuit":{"circuitId":"yas_marina","circuitName":"Yas Marina Circuit","Location":{"locality":"Abu Dhabi","country":"UAE"}},"FirstPractice":{"date":"2026-12-04","time":"09:30:00Z"},"SecondPractice":{"date":"2026-12-04","time":"13:00:00Z"},"ThirdPractice":{"date":"2026-12-05","time":"10:30:00Z"},"Qualifying":{"date":"2026-12-05","time":"14:00:00Z"}}

  ];
  const FALLBACK_CAL = apiToCalendar(FALLBACK_RAW);

  // ── Aktueller Kalender (wird durch API befüllt oder Fallback) ─────────
  let activeCal = FALLBACK_CAL;
  let seasonYear = 2026;

  // ── Render ────────────────────────────────────────────────────────────
  function render(){
    const now = new Date();
    let liveItem = null, liveGp = null;
    let nextItem = null, nextGp = null;
    const upcoming = [];

    for(const gp of activeCal){
      for(const s of gp.sessions){
        if(HIDDEN_SESSIONS.includes(s.type)) continue;
        const end = new Date(s.start.getTime() + s.dur * 60000);
        if(now >= s.start && now < end){
          liveItem = s; liveGp = gp;
        } else if(now < s.start){
          if(!nextItem){ nextItem = s; nextGp = gp; }
          upcoming.push({s, gp});
        }
      }
    }

    const liveEl = document.getElementById('live-content');
    if(liveItem){
      const chan = buildChan(liveItem.rtl, liveItem.orf);
      liveEl.innerHTML = `
        <div class="live-card">
          <div class="live-flag">${liveGp.flag}</div>
          <div class="live-badge">
            <div class="live-dot"></div>
            <span class="live-badge-txt">LIVE</span>
          </div>
          <div class="live-session">${liveItem.type}</div>
          <div class="live-race">${liveGp.race}</div>
          <div class="live-chan">
            <div class="live-chan-dot"></div>
            ${chan}
          </div>
        </div>`;
    } else {
      liveEl.innerHTML = `
        <div class="nothing">
          <div class="nothing-ico">🏁</div>
          <div class="nothing-txt">Gerade kein F1 im TV</div>
        </div>`;
    }

    const nextEl = document.getElementById('next-content');
    if(nextItem){
      const ms  = nextItem.start - now;
      const chan = buildChan(nextItem.rtl, nextItem.orf);
      nextEl.innerHTML = `
        <div class="next-card">
          <div class="next-session">${nextGp.flag} ${nextItem.type}</div>
          <div class="next-race">${nextGp.race}</div>
          <div class="next-row">
            <span class="next-ico">&#128197;</span>
            <span class="next-val">${fmtDate(nextItem.start)}</span>
          </div>
          <div class="next-row">
            <span class="next-ico">&#128336;</span>
            <span class="next-val">${fmtTime(nextItem.start)}</span>
          </div>
          <div class="next-chan">${chan}</div>
          <div class="countdown">Beginnt <span>${fmtCountdown(ms)}</span></div>
        </div>`;
    } else {
      nextEl.innerHTML = `<div class="nothing"><div class="nothing-txt">Saison ${seasonYear} beendet</div></div>`;
    }


    document.getElementById('update-time').textContent = 'Stand: ' + fmtTime(now);
    renderSeason();
  }

  // ── API-Fetch mit localStorage-Cache ─────────────────────────────────
  const CACHE_KEY = 'f1_calendar_v4';
  const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 Stunden

  async function fetchFromAPI(){
    // "current" = immer die aktuelle Saison, abgesagte Rennen sind nicht drin
    const res = await fetch('https://api.jolpi.ca/ergast/f1/current.json?limit=100');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    const races = json.MRData.RaceTable.Races;
    if(!Array.isArray(races) || races.length === 0) throw new Error('Leere Antwort');
    return {season: +json.MRData.RaceTable.season, races};
  }

  function applyCalendar(data){
    activeCal  = apiToCalendar(data.races);
    seasonYear = data.season || seasonYear;
    document.querySelectorAll('.season-year').forEach(el => el.textContent = seasonYear);
  }

  async function loadCalendar(){
    // Cache prüfen
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cached && (Date.now() - cached.ts) < CACHE_TTL){
        applyCalendar(cached.data);
        render();
        return;
      }
    } catch(_){}

    // API abrufen
    try {
      const data = await fetchFromAPI();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), data})); } catch(_){}
      applyCalendar(data);
    } catch(err){
      console.warn('API nicht erreichbar, verwende Fallback-Kalender:', err.message);
      activeCal = FALLBACK_CAL;
    }
    render();
  }

  // ── Start ─────────────────────────────────────────────────────────────
  render(); // sofort mit Fallback zeigen (kein leerer Bildschirm)
  loadCalendar(); // dann API nachladen

  setInterval(render, 30000); // Anzeige alle 30s aktualisieren (Countdown usw.)

  // Wenn Oma die App nach Stunden wieder öffnet → fresh nachladen
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      loadCalendar();
      loadStandings();
    }
  });

  // ── Team-Farben ───────────────────────────────────────────────────────
  const TEAM_COLORS = {
    'ferrari':    '#DC0000',
    'mclaren':    '#FF8000',
    'red bull':   '#3671C6',
    'mercedes':   '#27F4D2',
    'aston martin':'#229971',
    'alpine':     '#FF87BC',
    'williams':   '#64C4FF',
    'haas':       '#B6BABD',
    'sauber':     '#52E252',
    'audi':       '#52E252',
    'cadillac':   '#6B4FBB',
    'racing bulls':'#6692FF',
  };
  function teamColor(name){
    const key = (name||'').toLowerCase();
    for(const [k,v] of Object.entries(TEAM_COLORS)){
      if(key.includes(k)) return v;
    }
    return '#888';
  }

  // ── Fahrerwertung (Jolpica API) ───────────────────────────────────────
  const STAND_CACHE_KEY = 'f1_standings_current';
  const STAND_TTL = 12 * 60 * 60 * 1000; // 12 Stunden

  async function fetchStandings(){
    const res = await fetch('https://api.jolpi.ca/ergast/f1/current/driverStandings.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    return json.MRData.StandingsTable.StandingsLists[0].DriverStandings;
  }

  // ── Live-Positionen (OpenF1, nur während Session) ─────────────────────
  async function fetchLivePositions(){
    const res = await fetch('https://api.openf1.org/v1/position?session_key=latest');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    // Neuesten Eintrag pro Fahrer
    const latest = {};
    for(const d of data){
      if(!latest[d.driver_number] || d.date > latest[d.driver_number].date)
        latest[d.driver_number] = d;
    }
    // Fahrernamen nachladen
    const drRes = await fetch('https://api.openf1.org/v1/drivers?session_key=latest');
    const drivers = await drRes.json();
    const drMap = {};
    for(const d of drivers) drMap[d.driver_number] = d;
    return Object.values(latest)
      .sort((a,b) => a.position - b.position)
      .slice(0, 10)
      .map(p => ({
        pos: p.position,
        name: drMap[p.driver_number]
          ? drMap[p.driver_number].last_name
          : '#'+p.driver_number,
        team: drMap[p.driver_number]?.team_name || '',
        number: p.driver_number,
      }));
  }

  function renderStandings(list, isLive){
    const label = document.getElementById('stand-label');
    const el    = document.getElementById('stand-content');
    label.innerHTML = isLive
      ? '<span style="color:var(--fr)">&#9679;</span> Live-Positionen'
      : '&#127942; Fahrerwertung '+seasonYear;

    el.innerHTML = list.map((d,i) => {
      const posClass = i===0?'p1':i===1?'p2':i===2?'p3':'';
      const color = teamColor(d.team);
      const right = isLive
        ? `<div class="stand-gap">${d.gap||''}</div>`
        : `<div class="stand-pts">${d.pts}</div><div class="stand-pts-label">Punkte</div>`;
      return `<div class="stand-item">
        <div class="stand-pos ${posClass}">${d.pos}</div>
        <div style="width:4px;height:36px;border-radius:2px;background:${color};flex-shrink:0"></div>
        <div class="stand-info">
          <div class="stand-name">${d.name}</div>
          <div class="stand-team">${d.team}</div>
        </div>
        <div class="stand-right">${right}</div>
      </div>`;
    }).join('');
  }

  async function loadStandings(){
    // Erst aus Cache
    try {
      const c = JSON.parse(localStorage.getItem(STAND_CACHE_KEY)||'null');
      if(c && (Date.now()-c.ts) < STAND_TTL){
        renderStandings(c.data, false);
      }
    } catch(_){}

    // Wenn gerade eine Session live ist → live Positionen zeigen
    const now = new Date();
    let isLive = false;
    for(const gp of activeCal){
      for(const s of gp.sessions){
        const end = new Date(s.start.getTime() + s.dur*60000);
        if(now >= s.start && now < end){ isLive = true; break; }
      }
      if(isLive) break;
    }

    if(isLive){
      try {
        const live = await fetchLivePositions();
        renderStandings(live, true);
      } catch(_){
        // live nicht verfügbar → Wertung zeigen
        loadChampStandings();
      }
    } else {
      loadChampStandings();
    }
  }

  async function loadChampStandings(){
    try {
      const data = await fetchStandings();
      const list = data.map(d => ({
        pos: +d.position,
        name: d.Driver.familyName,
        team: d.Constructors[0]?.name || '',
        pts:  d.points,
      }));
      try { localStorage.setItem(STAND_CACHE_KEY, JSON.stringify({ts:Date.now(), data:list})); } catch(_){}
      renderStandings(list, false);
    } catch(err){
      document.getElementById('stand-content').innerHTML =
        '<div class="stand-loading">Wertung nicht verfügbar</div>';
    }
  }

  loadStandings();
  setInterval(loadStandings, 60000);

  // ── Saisonkalender ────────────────────────────────────────────────────

  function toggleRace(rnd){
    const el = document.getElementById('race-'+rnd);
    el.classList.toggle('open');
    if(el.classList.contains('open')) openRaces.add(rnd); else openRaces.delete(rnd);
  }

  function sessEnd(s){ return new Date(s.start.getTime() + s.dur*60000); }

  function renderSeason(){
    const now = new Date();
    const el  = document.getElementById('season-content');

    const visible = activeCal.filter(r => now <= sessEnd(r.sessions[r.sessions.length-1]));

    el.innerHTML = visible.map(r => {
      const start    = r.sessions[0].start;
      const lastDate = r.sessions[r.sessions.length-1].start;
      const curr     = now >= start && now <= sessEnd(r.sessions[r.sessions.length-1]);
      if(curr && !autoOpened){ openRaces.add(r.rnd); autoOpened = true; }

      const d1 = start.getDate()+'. '+MONTHS_DE[start.getMonth()];
      const d2 = lastDate.getDate()+'. '+MONTHS_DE[lastDate.getMonth()];
      const dateStr = start.getMonth()===lastDate.getMonth()
        ? start.getDate()+'–'+lastDate.getDate()+'. '+MONTHS_DE[lastDate.getMonth()]
        : d1+' – '+d2;

      const weekendSessions = r.sessions.filter(s => !HIDDEN_SESSIONS.includes(s.type));
      const sessHTML = weekendSessions.map(s => {
        const isPast = now > sessEnd(s);
        const isLive = now >= s.start && now < sessEnd(s);
        const chan   = buildChan(s.rtl, s.orf);
        return `<div class="sess-row${isPast?' past-sess':''}${isLive?' live-sess':''}">
          ${isLive ? '<div class="sess-live-dot"></div>' : ''}
          <div class="sess-type">${s.type}</div>
          <div class="sess-date">${DAYS_DE[s.start.getDay()]}. ${fmtDate(s.start).split(', ')[1]}</div>
          <div class="sess-time">${fmtTime(s.start)}</div>
        </div>
        <div class="sess-row${isPast?' past-sess':''}${isLive?' live-sess':''}" style="padding-top:0;padding-bottom:10px;border-bottom:1px solid #1a1a1a">
          <div style="width:${isLive?'8px':'0'};flex-shrink:0"></div>
          <div class="sess-type" style="font-size:11px;color:#666;font-family:'Barlow',sans-serif;font-weight:400">${chan}</div>
        </div>`;
      }).join('');

      const open = openRaces.has(r.rnd) ? ' open' : '';
      return `<div class="season-item${curr?' current':''}${open}" id="race-${r.rnd}">
        <div class="season-row" onclick="toggleRace(${r.rnd})">
          <div class="season-flag">${r.flag}</div>
          <div class="season-info">
            <div class="season-name">${r.race}</div>
            <div class="season-loc">${r.loc}</div>
          </div>
          <div class="season-right">
            <div class="season-date">${dateStr}</div>
            <div class="season-rnd">Rennen ${r.rnd}</div>
          </div>
          <div class="season-chevron">&#9654;</div>
        </div>
        <div class="season-sessions">${sessHTML}</div>
      </div>`;
    }).join('');
  }

  renderSeason();
</script>
