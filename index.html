<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DC0000">
  <title>F1 im TV</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fr: #DC0000;
      --fd: #8B0000;
      --fb: #0a0a0a;
      --fc: #1C1C1C;
      --fg: #C9A227;
      --fw: #ffffff;
      --fgray: #aaa;
    }

    html, body {
      background: var(--fb);
      color: var(--fw);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    .hdr {
      background: var(--fr);
      padding: 20px 20px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hdr::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.06) 40px, rgba(0,0,0,0.06) 41px);
    }
    .hdr-inner { position: relative; z-index: 1; }
    .hdr-horse { margin-bottom: 6px; }
    .hdr-title {
      font-family: 'Oswald', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .hdr-sub {
      font-size: 12px;
      letter-spacing: 3px;
      opacity: 0.8;
      margin-top: 3px;
    }

    .stripe {
      height: 5px;
      background: linear-gradient(90deg, var(--fg) 0%, var(--fg) 33%, #fff 33%, #fff 66%, var(--fg) 66%);
    }

    .sec { padding: 20px 16px 6px; }
    .sec-label {
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--fg);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-card {
      background: var(--fr);
      border-radius: 16px;
      padding: 22px 20px;
      position: relative;
      overflow: hidden;
    }
    .live-card::after {
      content: '';
      position: absolute;
      right: -14px; top: -14px;
      width: 110px; height: 110px;
      background: rgba(0,0,0,0.12);
      border-radius: 50%;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .live-dot {
      width: 11px; height: 11px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .live-badge-txt {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      letter-spacing: 3px;
      opacity: 0.9;
    }
    .live-session {
      font-family: 'Oswald', sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }
    .live-race {
      font-size: 18px;
      opacity: 0.95;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .live-flag {
      font-size: 34px;
      position: absolute;
      right: 20px; top: 20px;
      opacity: 0.45;
      z-index: 0;
    }
    .live-chan {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.28);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }
    .live-chan-dot {
      width: 11px; height: 11px;
      background: #4ADE80;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .nothing {
      background: var(--fc);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
    }
    .nothing-ico { font-size: 52px; margin-bottom: 14px; }
    .nothing-txt {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      color: var(--fgray);
    }

    .next-card {
      background: var(--fc);
      border-radius: 16px;
      padding: 22px 22px;
      border-left: 4px solid var(--fg);
    }
    .next-session {
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .next-race {
      font-size: 16px;
      color: #bbb;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .next-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .next-ico { font-size: 18px; color: var(--fg); }
    .next-val {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      color: var(--fg);
    }
    .next-chan { font-size: 17px; color: #ddd; margin-top: 4px; }
    .countdown {
      font-size: 15px;
      color: var(--fgray);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .countdown span { color: #fff; font-weight: 600; }

    .sched-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 0;
      border-bottom: 1px solid #222;
    }
    .sched-item:last-child { border-bottom: none; }
    .sched-flag { font-size: 28px; flex-shrink: 0; width: 36px; text-align: center; }
    .sched-info { flex: 1; min-width: 0; }
    .sched-session {
      font-family: 'Oswald', sans-serif;
      font-size: 19px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sched-race {
      font-size: 13px;
      color: var(--fgray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .sched-right { text-align: right; flex-shrink: 0; }
    .sched-date {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: var(--fg);
    }
    .sched-time { font-size: 14px; color: var(--fgray); margin-top: 1px; }
    .sched-chan { font-size: 12px; color: #888; margin-top: 2px; }

    .season-item {
      border-bottom: 1px solid #1e1e1e;
    }
    .season-item:last-child { border-bottom: none; }
    .season-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      cursor: pointer;
      user-select: none;
    }
    .season-item.past .season-row { opacity: 0.4; }
    .season-item.current .season-row { opacity: 1; }
    .season-item.current { border-left: 3px solid var(--fr); padding-left: 12px; }
    .season-flag { font-size: 28px; flex-shrink: 0; width: 36px; text-align: center; }
    .season-info { flex: 1; min-width: 0; }
    .season-name {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .season-loc { font-size: 12px; color: var(--fgray); margin-top: 2px; }
    .season-right { text-align: right; flex-shrink: 0; }
    .season-date {
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      color: var(--fg);
    }
    .season-rnd { font-size: 11px; color: #666; margin-top: 2px; }
    .season-chevron {
      font-size: 14px;
      color: #555;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .season-item.open .season-chevron { transform: rotate(90deg); color: var(--fg); }

    .season-sessions {
      display: none;
      background: #111;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .season-item.open .season-sessions { display: block; }
    .sess-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid #1a1a1a;
    }
    .sess-row:last-child { border-bottom: none; }
    .sess-row.past-sess { opacity: 0.4; }
    .sess-row.live-sess { background: rgba(220,0,0,0.15); }
    .sess-type {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      font-weight: 500;
      width: 120px;
      flex-shrink: 0;
    }
    .sess-date { font-size: 13px; color: var(--fgray); flex: 1; }
    .sess-time {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: var(--fg);
      flex-shrink: 0;
    }
    .sess-live-dot {
      width: 8px; height: 8px;
      background: var(--fr);
      border-radius: 50%;
      flex-shrink: 0;
      animation: blink 1.4s infinite;
    }

    .stand-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #222;
    }
    .stand-item:last-child { border-bottom: none; }
    .stand-pos {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--fgray);
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .stand-pos.p1 { color: #FFD700; }
    .stand-pos.p2 { color: #C0C0C0; }
    .stand-pos.p3 { color: #CD7F32; }
    .stand-info { flex: 1; min-width: 0; }
    .stand-name {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stand-team {
      font-size: 13px;
      color: var(--fgray);
      margin-top: 2px;
    }
    .stand-right { text-align: right; flex-shrink: 0; }
    .stand-pts {
      font-family: 'Oswald', sans-serif;
      font-size: 20px;
      color: var(--fg);
    }
    .stand-pts-label { font-size: 11px; color: #666; }
    .stand-gap {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      color: #bbb;
    }
    .stand-loading {
      text-align: center;
      padding: 20px;
      color: var(--fgray);
      font-size: 15px;
    }

    .update-time {
      text-align: center;
      font-size: 12px;
      color: #666;
      padding: 16px 0 0;
      letter-spacing: 1px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      padding: 8px 0 0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="hdr-inner">
      <div class="hdr-horse">
        <svg width="50" height="50" viewBox="0 0 100 100" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M62 8 C62 8 70 6 74 12 C78 18 72 24 68 26 C72 26 78 24 80 20 C82 16 80 10 76 8 C82 6 88 10 88 16 C88 24 80 30 72 30 L70 34 C74 36 78 42 76 50 C74 58 66 62 60 60 L58 72 C58 80 54 88 48 90 L44 90 C44 90 48 82 48 74 L46 74 C46 74 42 82 36 84 L32 84 C32 84 38 74 38 66 L36 68 C36 68 28 74 20 72 C12 70 8 62 10 54 C12 48 18 44 24 44 C20 42 14 38 12 32 C10 26 14 20 20 18 C26 16 34 20 36 26 C38 22 44 16 50 14 C54 12 58 10 62 8Z"/>
        </svg>
      </div>
      <div class="hdr-title">F1 im TV</div>
      <div class="hdr-sub">Formel 1 Programm</div>
    </div>
  </div>
  <div class="stripe"></div>

  <div class="sec">
    <div class="sec-label">&#9679; Jetzt im Fernsehen</div>
    <div id="live-content"></div>
  </div>

  <div class="sec">
    <div class="sec-label">&#8594; Als nächstes</div>
    <div id="next-content"></div>
  </div>

  <div class="sec" style="padding-bottom: 16px;">
    <div class="sec-label">&#128197; Rennen 2026</div>
    <div id="season-content"></div>
  </div>

  <div class="sec" style="padding-bottom: 16px;">
    <div class="sec-label" id="stand-label">&#127942; Fahrerwertung</div>
    <div id="stand-content"><div class="stand-loading">Wird geladen…</div></div>
  </div>

  <div class="update-time" id="update-time"></div>
  <div class="footer">Scuderia Ferrari &middot; Formel 1 2026</div>

</div>

<script>
  const DAYS_DE   = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  const MONTHS_DE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const openRaces = new Set(); // welche Rennen im Kalender aufgeklappt sind
  let autoOpened = false;

  // ── Hilfsfunktionen ───────────────────────────────────────────────────
  function fmtDate(d){
    return DAYS_DE[d.getDay()]+', '+d.getDate()+'. '+MONTHS_DE[d.getMonth()];
  }
  function fmtTime(d){
    return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+' Uhr';
  }
  function fmtCountdown(ms){
    if(ms < 0) return '';
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    if(h >= 48){ return 'in '+Math.floor(h/24)+' Tagen'; }
    if(h >= 24){ const d=Math.floor(h/24); return 'in '+d+' Tag'+(d===1?'':'en'); }
    if(h > 0)  { return 'in '+h+' Std. '+m+' Min.'; }
    return 'in '+m+' Minute'+(m===1?'':'n');
  }

  // ── Rennstrecken (OpenF1 "location") → Anzeige ───────────────────────
  const TRACKS = {
    'Melbourne':         {race:'Australien',     loc:'Albert Park, Melbourne',          flag:'🇦🇺'},
    'Shanghai':          {race:'China',          loc:'Shanghai International Circuit',  flag:'🇨🇳'},
    'Suzuka':            {race:'Japan',          loc:'Suzuka Circuit',                  flag:'🇯🇵'},
    'Sakhir':            {race:'Bahrain',        loc:'Bahrain International Circuit',   flag:'🇧🇭'},
    'Jeddah':            {race:'Saudi-Arabien',  loc:'Jeddah Corniche Circuit',         flag:'🇸🇦'},
    'Miami Gardens':     {race:'Miami',          loc:'Miami International Autodrome',   flag:'🇺🇸'},
    'Montréal':          {race:'Kanada',         loc:'Circuit Gilles Villeneuve',       flag:'🇨🇦'},
    'Monte Carlo':       {race:'Monaco',         loc:'Circuit de Monaco',               flag:'🇲🇨'},
    'Barcelona':         {race:'Spanien',        loc:'Circuit de Barcelona-Catalunya',  flag:'🇪🇸'},
    'Spielberg':         {race:'Österreich',     loc:'Red Bull Ring, Spielberg',        flag:'🇦🇹'},
    'Silverstone':       {race:'Großbritannien', loc:'Silverstone Circuit',             flag:'🇬🇧'},
    'Spa-Francorchamps': {race:'Belgien',        loc:'Circuit de Spa-Francorchamps',    flag:'🇧🇪'},
    'Budapest':          {race:'Ungarn',         loc:'Hungaroring, Budapest',           flag:'🇭🇺'},
    'Zandvoort':         {race:'Niederlande',    loc:'Circuit Zandvoort',               flag:'🇳🇱'},
    'Monza':             {race:'Italien',        loc:'Autodromo Nazionale Monza',       flag:'🇮🇹'},
    'Madrid':            {race:'Madrid',         loc:'Circuito de Madrid',              flag:'🇪🇸'},
    'Baku':              {race:'Aserbaidschan',  loc:'Baku City Circuit',               flag:'🇦🇿'},
    'Kuala Lumpur':      {race:'Malaysia',       loc:'Sepang, Kuala Lumpur',            flag:'🇲🇾'},
    'Marina Bay':        {race:'Singapur',       loc:'Marina Bay Street Circuit',       flag:'🇸🇬'},
    'Austin':            {race:'USA',            loc:'Circuit of the Americas, Austin', flag:'🇺🇸'},
    'Mexico City':       {race:'Mexiko',         loc:'Autodromo Hermanos Rodriguez',    flag:'🇲🇽'},
    'São Paulo':         {race:'Brasilien',      loc:'Autodromo Jose Carlos Pace',      flag:'🇧🇷'},
    'Las Vegas':         {race:'Las Vegas',      loc:'Las Vegas Strip Circuit',         flag:'🇺🇸'},
    'Lusail':            {race:'Katar',          loc:'Losail International Circuit',    flag:'🇶🇦'},
    'Yas Marina':        {race:'Abu Dhabi',      loc:'Yas Marina Circuit',              flag:'🇦🇪'},
  };

  // ── API-Sessionname → Deutsch ─────────────────────────────────────────
  const SESSION_DE = {
    'Practice 1':'FP1', 'Practice 2':'FP2', 'Practice 3':'FP3',
    'Qualifying':'Qualifying', 'Race':'Rennen',
    'Sprint':'Sprint', 'Sprint Qualifying':'Sprintqualifying',
  };

  // ── Free-TV zusätzlich zu Sky (pro Strecke und Session) ───────────────
  const FREE_TV = {
    'Monte Carlo':       {Qualifying:{rtl:true, orf:true}, Rennen:{rtl:true, orf:true}},
    'Barcelona':         {Qualifying:{rtl:true}},
    'Spielberg':         {Qualifying:{orf:true},           Rennen:{orf:true}},
    'Silverstone':       {Qualifying:{orf:true},           Rennen:{rtl:true, orf:true}},
    'Spa-Francorchamps': {Qualifying:{orf:true},           Rennen:{rtl:true, orf:true}},
    'Zandvoort':         {Qualifying:{orf:true},           Rennen:{rtl:true, orf:true}},
    'Monza':             {Qualifying:{orf:true},           Rennen:{rtl:true, orf:true}},
    'São Paulo':         {Rennen:{rtl:true}},
  };

  function buildChan(rtl, orf){
    const parts = ['Sky Sport F1'];
    if(rtl) parts.push('RTL');
    if(orf) parts.push('ORF 1');
    return parts.join(' · ');
  }

  function makeSession(location, type, start, dur){
    const tv = (FREE_TV[location] || {})[type] || {};
    return {type, start, dur, rtl: !!tv.rtl, orf: !!tv.orf};
  }

  // Liste von Wochenenden → mit Rundennummer, Name, Flagge
  function buildCalendar(meetings){
    return meetings
      .filter(m => TRACKS[m.location] && m.sessions.length)
      .map(m => { m.sessions.sort((a,b) => a.start - b.start); return m; })
      .sort((a,b) => a.sessions[0].start - b.sessions[0].start)
      .map((m, i) => ({rnd: i+1, ...TRACKS[m.location], sessions: m.sessions}));
  }

  // ── API-Daten → internes Format (abgesagte Rennen & Tests fliegen raus) ─
  function apiToCalendar(sessions){
    const meetings = {};
    for(const s of sessions){
      const type = SESSION_DE[s.session_name];
      if(!type || s.is_cancelled) continue;
      const k = s.meeting_key;
      if(!meetings[k]) meetings[k] = {location: s.location, sessions: []};
      const start = new Date(s.date_start);
      const dur   = Math.round((new Date(s.date_end) - start) / 60000) || 60;
      meetings[k].sessions.push(makeSession(s.location, type, start, dur));
    }
    return buildCalendar(Object.values(meetings));
  }

  // ── Fallback-Kalender, falls kein Internet (Zeiten in UTC, Stand 27.09.2026) ─
  const FALLBACK_RAW = [
    ["Melbourne", [["FP1","2026-03-06T01:30Z",60],["FP2","2026-03-06T05:00Z",60],["FP3","2026-03-07T01:30Z",60],["Qualifying","2026-03-07T05:00Z",60],["Rennen","2026-03-08T04:00Z",120]]],
    ["Shanghai", [["FP1","2026-03-13T03:30Z",60],["Sprintqualifying","2026-03-13T07:30Z",44],["Sprint","2026-03-14T03:00Z",60],["Qualifying","2026-03-14T07:00Z",60],["Rennen","2026-03-15T07:00Z",120]]],
    ["Suzuka", [["FP1","2026-03-27T02:30Z",60],["FP2","2026-03-27T06:00Z",60],["FP3","2026-03-28T02:30Z",60],["Qualifying","2026-03-28T06:00Z",60],["Rennen","2026-03-29T05:00Z",120]]],
    ["Miami Gardens", [["FP1","2026-05-01T16:00Z",90],["Sprintqualifying","2026-05-01T20:30Z",44],["Sprint","2026-05-02T16:00Z",60],["Qualifying","2026-05-02T20:00Z",60],["Rennen","2026-05-03T17:00Z",120]]],
    ["Montréal", [["FP1","2026-05-22T16:30Z",60],["Sprintqualifying","2026-05-22T20:30Z",44],["Sprint","2026-05-23T16:00Z",60],["Qualifying","2026-05-23T20:00Z",60],["Rennen","2026-05-24T20:00Z",120]]],
    ["Monte Carlo", [["FP1","2026-06-05T11:30Z",60],["FP2","2026-06-05T15:00Z",60],["FP3","2026-06-06T10:30Z",60],["Qualifying","2026-06-06T14:00Z",60],["Rennen","2026-06-07T13:00Z",120]]],
    ["Barcelona", [["FP1","2026-06-12T11:30Z",60],["FP2","2026-06-12T15:00Z",60],["FP3","2026-06-13T10:30Z",60],["Qualifying","2026-06-13T14:00Z",60],["Rennen","2026-06-14T13:00Z",120]]],
    ["Spielberg", [["FP1","2026-06-26T11:30Z",60],["FP2","2026-06-26T15:00Z",60],["FP3","2026-06-27T10:30Z",60],["Qualifying","2026-06-27T14:00Z",60],["Rennen","2026-06-28T13:00Z",120]]],
    ["Silverstone", [["FP1","2026-07-03T11:30Z",60],["Sprintqualifying","2026-07-03T15:30Z",44],["Sprint","2026-07-04T11:00Z",60],["Qualifying","2026-07-04T15:00Z",60],["Rennen","2026-07-05T14:00Z",120]]],
    ["Spa-Francorchamps", [["FP1","2026-07-17T11:30Z",60],["FP2","2026-07-17T15:00Z",60],["FP3","2026-07-18T10:30Z",60],["Qualifying","2026-07-18T14:00Z",60],["Rennen","2026-07-19T13:00Z",120]]],
    ["Budapest", [["FP1","2026-07-24T11:30Z",60],["FP2","2026-07-24T15:00Z",60],["FP3","2026-07-25T10:30Z",60],["Qualifying","2026-07-25T14:00Z",60],["Rennen","2026-07-26T13:00Z",120]]],
    ["Zandvoort", [["FP1","2026-08-21T10:30Z",60],["Sprintqualifying","2026-08-21T14:30Z",44],["Sprint","2026-08-22T10:00Z",60],["Qualifying","2026-08-22T14:00Z",60],["Rennen","2026-08-23T13:00Z",120]]],
    ["Monza", [["FP1","2026-09-04T10:30Z",60],["FP2","2026-09-04T14:00Z",60],["FP3","2026-09-05T10:30Z",60],["Qualifying","2026-09-05T14:00Z",60],["Rennen","2026-09-06T13:00Z",120]]],
    ["Madrid", [["FP1","2026-09-11T11:30Z",60],["FP2","2026-09-11T15:00Z",60],["FP3","2026-09-12T10:30Z",60],["Qualifying","2026-09-12T14:00Z",60],["Rennen","2026-09-13T13:00Z",120]]],
    ["Baku", [["FP1","2026-09-24T08:30Z",60],["FP2","2026-09-24T12:00Z",60],["FP3","2026-09-25T08:30Z",60],["Qualifying","2026-09-25T12:00Z",60],["Rennen","2026-09-26T11:00Z",120]]],
    ["Kuala Lumpur", [["FP1","2026-10-02T04:30Z",60],["FP2","2026-10-02T08:00Z",60],["FP3","2026-10-03T04:30Z",60],["Qualifying","2026-10-03T08:00Z",60],["Rennen","2026-10-04T07:00Z",120]]],
    ["Marina Bay", [["FP1","2026-10-09T08:30Z",60],["Sprintqualifying","2026-10-09T12:30Z",44],["Sprint","2026-10-10T09:00Z",60],["Qualifying","2026-10-10T13:00Z",60],["Rennen","2026-10-11T12:00Z",120]]],
    ["Austin", [["FP1","2026-10-23T17:30Z",60],["FP2","2026-10-23T21:00Z",60],["FP3","2026-10-24T17:30Z",60],["Qualifying","2026-10-24T21:00Z",60],["Rennen","2026-10-25T20:00Z",120]]],
    ["Mexico City", [["FP1","2026-10-30T18:30Z",60],["FP2","2026-10-30T22:00Z",60],["FP3","2026-10-31T17:30Z",60],["Qualifying","2026-10-31T21:00Z",60],["Rennen","2026-11-01T20:00Z",120]]],
    ["São Paulo", [["FP1","2026-11-06T15:30Z",60],["FP2","2026-11-06T19:00Z",60],["FP3","2026-11-07T14:30Z",60],["Qualifying","2026-11-07T18:00Z",60],["Rennen","2026-11-08T17:00Z",120]]],
    ["Las Vegas", [["FP1","2026-11-20T00:30Z",60],["FP2","2026-11-20T04:00Z",60],["FP3","2026-11-21T00:30Z",60],["Qualifying","2026-11-21T04:00Z",60],["Rennen","2026-11-22T04:00Z",120]]],
    ["Lusail", [["FP1","2026-11-27T13:30Z",60],["FP2","2026-11-27T17:00Z",60],["FP3","2026-11-28T14:30Z",60],["Qualifying","2026-11-28T18:00Z",60],["Rennen","2026-11-29T16:00Z",120]]],
    ["Yas Marina", [["FP1","2026-12-04T09:30Z",60],["FP2","2026-12-04T13:00Z",60],["FP3","2026-12-05T10:30Z",60],["Qualifying","2026-12-05T14:00Z",60],["Rennen","2026-12-06T13:00Z",120]]],
  ];
  const FALLBACK_CAL = buildCalendar(FALLBACK_RAW.map(([location, sess]) => ({
    location,
    sessions: sess.map(([type, iso, dur]) => makeSession(location, type, new Date(iso), dur)),
  })));

  // ── Aktueller Kalender (wird durch API befüllt oder Fallback) ─────────
  let activeCal = FALLBACK_CAL;

  // ── Render ────────────────────────────────────────────────────────────
  function render(){
    const now = new Date();
    let liveItem = null, liveGp = null;
    let nextItem = null, nextGp = null;
    const upcoming = [];

    for(const gp of activeCal){
      for(const s of gp.sessions){
        const end = new Date(s.start.getTime() + s.dur * 60000);
        if(now >= s.start && now < end){
          liveItem = s; liveGp = gp;
        } else if(now < s.start){
          if(!nextItem){ nextItem = s; nextGp = gp; }
          upcoming.push({s, gp});
        }
      }
    }

    const liveEl = document.getElementById('live-content');
    if(liveItem){
      const chan = buildChan(liveItem.rtl, liveItem.orf);
      liveEl.innerHTML = `
        <div class="live-card">
          <div class="live-flag">${liveGp.flag}</div>
          <div class="live-badge">
            <div class="live-dot"></div>
            <span class="live-badge-txt">LIVE</span>
          </div>
          <div class="live-session">${liveItem.type}</div>
          <div class="live-race">${liveGp.race}</div>
          <div class="live-chan">
            <div class="live-chan-dot"></div>
            ${chan}
          </div>
        </div>`;
    } else {
      liveEl.innerHTML = `
        <div class="nothing">
          <div class="nothing-ico">🏁</div>
          <div class="nothing-txt">Gerade kein F1 im TV</div>
        </div>`;
    }

    const nextEl = document.getElementById('next-content');
    if(nextItem){
      const ms  = nextItem.start - now;
      const chan = buildChan(nextItem.rtl, nextItem.orf);
      nextEl.innerHTML = `
        <div class="next-card">
          <div class="next-session">${nextGp.flag} ${nextItem.type}</div>
          <div class="next-race">${nextGp.race}</div>
          <div class="next-row">
            <span class="next-ico">&#128197;</span>
            <span class="next-val">${fmtDate(nextItem.start)}</span>
          </div>
          <div class="next-row">
            <span class="next-ico">&#128336;</span>
            <span class="next-val">${fmtTime(nextItem.start)}</span>
          </div>
          <div class="next-chan">${chan}</div>
          <div class="countdown">Beginnt <span>${fmtCountdown(ms)}</span></div>
        </div>`;
    } else {
      nextEl.innerHTML = `<div class="nothing"><div class="nothing-txt">Saison 2026 beendet</div></div>`;
    }


    document.getElementById('update-time').textContent = 'Stand: ' + fmtTime(now);
    renderSeason();
  }

  // ── API-Fetch mit localStorage-Cache ─────────────────────────────────
  const CACHE_KEY = 'f1_sessions_v3';
  const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 Stunden

  async function fetchFromAPI(){
    const res = await fetch('https://api.openf1.org/v1/sessions?year=2026');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('Leere Antwort');
    return data;
  }

  async function loadCalendar(){
    // Cache prüfen
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if(cached && (Date.now() - cached.ts) < CACHE_TTL){
        activeCal = apiToCalendar(cached.data);
        render();
        return;
      }
    } catch(_){}

    // API abrufen
    try {
      const data = await fetchFromAPI();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), data})); } catch(_){}
      activeCal = apiToCalendar(data);
    } catch(err){
      console.warn('API nicht erreichbar, verwende Fallback-Kalender:', err.message);
      activeCal = FALLBACK_CAL;
    }
    render();
  }

  // ── Start ─────────────────────────────────────────────────────────────
  render(); // sofort mit Fallback zeigen (kein leerer Bildschirm)
  loadCalendar(); // dann API nachladen

  setInterval(render, 30000); // Anzeige alle 30s aktualisieren (Countdown usw.)

  // Wenn Oma die App nach Stunden wieder öffnet → fresh nachladen
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      loadCalendar();
      loadStandings();
    }
  });

  // ── Team-Farben ───────────────────────────────────────────────────────
  const TEAM_COLORS = {
    'ferrari':    '#DC0000',
    'mclaren':    '#FF8000',
    'red bull':   '#3671C6',
    'mercedes':   '#27F4D2',
    'aston martin':'#229971',
    'alpine':     '#FF87BC',
    'williams':   '#64C4FF',
    'haas':       '#B6BABD',
    'sauber':     '#52E252',
    'audi':       '#52E252',
    'cadillac':   '#6B4FBB',
    'racing bulls':'#6692FF',
  };
  function teamColor(name){
    const key = (name||'').toLowerCase();
    for(const [k,v] of Object.entries(TEAM_COLORS)){
      if(key.includes(k)) return v;
    }
    return '#888';
  }

  // ── Fahrerwertung (Jolpica API) ───────────────────────────────────────
  const STAND_CACHE_KEY = 'f1_standings_2026';
  const STAND_TTL = 12 * 60 * 60 * 1000; // 12 Stunden

  async function fetchStandings(){
    const res = await fetch('https://api.jolpi.ca/ergast/f1/2026/driverStandings.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    return json.MRData.StandingsTable.StandingsLists[0].DriverStandings;
  }

  // ── Live-Positionen (OpenF1, nur während Session) ─────────────────────
  async function fetchLivePositions(){
    const res = await fetch('https://api.openf1.org/v1/position?session_key=latest');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    // Neuesten Eintrag pro Fahrer
    const latest = {};
    for(const d of data){
      if(!latest[d.driver_number] || d.date > latest[d.driver_number].date)
        latest[d.driver_number] = d;
    }
    // Fahrernamen nachladen
    const drRes = await fetch('https://api.openf1.org/v1/drivers?session_key=latest');
    const drivers = await drRes.json();
    const drMap = {};
    for(const d of drivers) drMap[d.driver_number] = d;
    return Object.values(latest)
      .sort((a,b) => a.position - b.position)
      .slice(0, 10)
      .map(p => ({
        pos: p.position,
        name: drMap[p.driver_number]
          ? drMap[p.driver_number].last_name
          : '#'+p.driver_number,
        team: drMap[p.driver_number]?.team_name || '',
        number: p.driver_number,
      }));
  }

  function renderStandings(list, isLive){
    const label = document.getElementById('stand-label');
    const el    = document.getElementById('stand-content');
    label.innerHTML = isLive
      ? '<span style="color:var(--fr)">&#9679;</span> Live-Positionen'
      : '&#127942; Fahrerwertung 2026';

    el.innerHTML = list.map((d,i) => {
      const posClass = i===0?'p1':i===1?'p2':i===2?'p3':'';
      const color = teamColor(d.team);
      const right = isLive
        ? `<div class="stand-gap">${d.gap||''}</div>`
        : `<div class="stand-pts">${d.pts}</div><div class="stand-pts-label">Punkte</div>`;
      return `<div class="stand-item">
        <div class="stand-pos ${posClass}">${d.pos}</div>
        <div style="width:4px;height:36px;border-radius:2px;background:${color};flex-shrink:0"></div>
        <div class="stand-info">
          <div class="stand-name">${d.name}</div>
          <div class="stand-team">${d.team}</div>
        </div>
        <div class="stand-right">${right}</div>
      </div>`;
    }).join('');
  }

  async function loadStandings(){
    // Erst aus Cache
    try {
      const c = JSON.parse(localStorage.getItem(STAND_CACHE_KEY)||'null');
      if(c && (Date.now()-c.ts) < STAND_TTL){
        renderStandings(c.data, false);
      }
    } catch(_){}

    // Wenn gerade eine Session live ist → live Positionen zeigen
    const now = new Date();
    let isLive = false;
    for(const gp of activeCal){
      for(const s of gp.sessions){
        const end = new Date(s.start.getTime() + s.dur*60000);
        if(now >= s.start && now < end){ isLive = true; break; }
      }
      if(isLive) break;
    }

    if(isLive){
      try {
        const live = await fetchLivePositions();
        renderStandings(live, true);
      } catch(_){
        // live nicht verfügbar → Wertung zeigen
        loadChampStandings();
      }
    } else {
      loadChampStandings();
    }
  }

  async function loadChampStandings(){
    try {
      const data = await fetchStandings();
      const list = data.map(d => ({
        pos: +d.position,
        name: d.Driver.familyName,
        team: d.Constructors[0]?.name || '',
        pts:  d.points,
      }));
      try { localStorage.setItem(STAND_CACHE_KEY, JSON.stringify({ts:Date.now(), data:list})); } catch(_){}
      renderStandings(list, false);
    } catch(err){
      document.getElementById('stand-content').innerHTML =
        '<div class="stand-loading">Wertung nicht verfügbar</div>';
    }
  }

  loadStandings();
  setInterval(loadStandings, 60000);

  // ── Saisonkalender ────────────────────────────────────────────────────

  function toggleRace(rnd){
    const el = document.getElementById('race-'+rnd);
    el.classList.toggle('open');
    if(el.classList.contains('open')) openRaces.add(rnd); else openRaces.delete(rnd);
  }

  function sessEnd(s){ return new Date(s.start.getTime() + s.dur*60000); }

  function renderSeason(){
    const now = new Date();
    const el  = document.getElementById('season-content');

    const visible = activeCal.filter(r => now <= sessEnd(r.sessions[r.sessions.length-1]));

    el.innerHTML = visible.map(r => {
      const start    = r.sessions[0].start;
      const lastDate = r.sessions[r.sessions.length-1].start;
      const curr     = now >= start && now <= sessEnd(r.sessions[r.sessions.length-1]);
      if(curr && !autoOpened){ openRaces.add(r.rnd); autoOpened = true; }

      const d1 = start.getDate()+'. '+MONTHS_DE[start.getMonth()];
      const d2 = lastDate.getDate()+'. '+MONTHS_DE[lastDate.getMonth()];
      const dateStr = start.getMonth()===lastDate.getMonth()
        ? start.getDate()+'–'+lastDate.getDate()+'. '+MONTHS_DE[lastDate.getMonth()]
        : d1+' – '+d2;

      const weekendSessions = r.sessions.filter(s => !['FP1','FP2','Sprintqualifying'].includes(s.type));
      const sessHTML = weekendSessions.map(s => {
        const isPast = now > sessEnd(s);
        const isLive = now >= s.start && now < sessEnd(s);
        const chan   = buildChan(s.rtl, s.orf);
        return `<div class="sess-row${isPast?' past-sess':''}${isLive?' live-sess':''}">
          ${isLive ? '<div class="sess-live-dot"></div>' : ''}
          <div class="sess-type">${s.type}</div>
          <div class="sess-date">${DAYS_DE[s.start.getDay()]}. ${fmtDate(s.start).split(', ')[1]}</div>
          <div class="sess-time">${fmtTime(s.start)}</div>
        </div>
        <div class="sess-row${isPast?' past-sess':''}${isLive?' live-sess':''}" style="padding-top:0;padding-bottom:10px;border-bottom:1px solid #1a1a1a">
          <div style="width:${isLive?'8px':'0'};flex-shrink:0"></div>
          <div class="sess-type" style="font-size:11px;color:#666;font-family:'Barlow',sans-serif;font-weight:400">${chan}</div>
        </div>`;
      }).join('');

      const open = openRaces.has(r.rnd) ? ' open' : '';
      return `<div class="season-item${curr?' current':''}${open}" id="race-${r.rnd}">
        <div class="season-row" onclick="toggleRace(${r.rnd})">
          <div class="season-flag">${r.flag}</div>
          <div class="season-info">
            <div class="season-name">${r.race}</div>
            <div class="season-loc">${r.loc}</div>
          </div>
          <div class="season-right">
            <div class="season-date">${dateStr}</div>
            <div class="season-rnd">Rennen ${r.rnd}</div>
          </div>
          <div class="season-chevron">&#9654;</div>
        </div>
        <div class="season-sessions">${sessHTML}</div>
      </div>`;
    }).join('');
  }

  renderSeason();
</script>
